[theme]
# shadcn/ui "zinc" dark. Component styling (cards, badges, buttons) lives in views/common.py.
base = "dark"
primaryColor = "#FAFAFA"
backgroundColor = "#09090B"
secondaryBackgroundColor = "#18181B"
textColor = "#FAFAFA"
linkColor = "#FAFAFA"
borderColor = "#27272A"
showWidgetBorder = true
baseRadius = "6px"
baseFontSize = 14
codeTextColor = "#FAFAFA"
codeBackgroundColor = "#18181B"
dataframeHeaderBackgroundColor = "#09090B"
dataframeBorderColor = "#27272A"
font = "Geist, 'IBM Plex Sans Arabic', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
headingFont = "Geist, 'IBM Plex Sans Arabic', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
codeFont = "'Geist Mono', ui-monospace, SFMono-Regular, Menlo, monospace"

[client]
toolbarMode = "minimal"

[server]
runOnSave = true
