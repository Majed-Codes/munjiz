[theme]
# "Night at the Expo": dark stage, Expo emerald, desert gold. Extra styling lives in views/common.py.
base = "dark"
primaryColor = "#2FBF8A"
backgroundColor = "#06120E"
secondaryBackgroundColor = "#10261D"
textColor = "#EAF3EE"
linkColor = "#7FE0B8"
borderColor = "#24402F"
showWidgetBorder = true
baseRadius = "12px"
codeTextColor = "#8FE6C2"
codeBackgroundColor = "#10261D"
dataframeHeaderBackgroundColor = "#10261D"
dataframeBorderColor = "#24402F"
font = "'IBM Plex Sans', 'IBM Plex Sans Arabic', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
headingFont = "Rubik, 'IBM Plex Sans Arabic', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"

[client]
toolbarMode = "minimal"

[server]
runOnSave = true
